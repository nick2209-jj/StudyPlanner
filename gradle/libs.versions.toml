[versions]
agp = "8.7.0"
kotlin = "1.9.24"
coreKtx = "1.15.0"
appcompat = "1.7.0"
activity = "1.9.3"
material = "1.12.0"
constraintlayout = "2.1.4"
cardview = "1.0.0"
recyclerview = "1.3.2"
navigationFragmentKtx = "2.8.4"
navigationUiKtx = "2.8.4"
firebaseBom = "33.7.0"
glide = "4.16.0"
lottie = "6.4.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"

[libraries]

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }

material = { group = "com.google.android.material", name = "material", version.ref = "material" }

androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }

androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }

androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigationFragmentKtx" }

androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigationUiKtx" }

lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }

glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }


# Firebase

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }

firebase-auth-ktx = { module = "com.google.firebase:firebase-auth-ktx" }

firebase-firestore-ktx = { module = "com.google.firebase:firebase-firestore-ktx" }


# Testing

junit = { group = "junit", name = "junit", version.ref = "junit" }

androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }

androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }

kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }